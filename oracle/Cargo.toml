[package]
name = "page-oracle"
version = "0.1.0"
edition = "2024"
# The version the root workspace pins in `../rust-toolchain.toml`. This is a workspace of its own,
# so it cannot inherit the root's declaration and states the same version again.
rust-version = "1.99.1"
publish = false
description = "The development oracle: what LibreOffice lays out for the documents the engine writes, and the engine's PDF pages compared against PDFium"

# A workspace of its own, so the root workspace's build, its lockfile and the parity harness's
# comparison identity are untouched by this package and by anything it resolves.
[workspace]

[dependencies]
document-engine = { path = "../document-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
lopdf = "=0.42.0"
pdf-extract = { version = "=0.12.1", default-features = false }
regex = "1"
# The one picture the corpus embeds is generated in code, with the same encoder version the engine
# resolves, so no hand-written PNG/zlib/CRC encoder is maintained here.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libloading = "0.8"

[build-dependencies]
# The engine identity the comparison names is a digest; the rule is the harness's own, included by
# `build.rs`.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
