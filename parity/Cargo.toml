[package]
name = "document-parity"
version = "0.1.0"
edition = "2024"
publish = false

# The reader half of the reference is the product's own reader sources, copied byte for byte under
# `src/reference_sources/` and compiled here. Their unit tests are built and run with this crate's,
# so the reference's own suite is part of the gate rather than left behind.
[lib]
name = "document_parity"
path = "src/lib.rs"
test = true

[build-dependencies]
sha2 = "0.10"

# The reader sources carry their own tests, which build only when this crate's library tests are
# built; they use these two helpers the product's own test modules use.
[dev-dependencies]
flate2 = "=1.1.10"
tempfile = "3"

[dependencies]
document-engine = { path = "../document-engine", features = ["test-support"] }
anyhow = "1.0"
hayro = "=0.7.1"
hayro-cmap = "=0.1.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
office_oxide = { version = "=0.1.13" }
pdf-extract = { version = "=0.12.1", default-features = false }
quick-xml = { version = "=0.39.4", default-features = false }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1.50", default-features = false, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# The writer runner kills a timed-out program's whole process group, not just the direct child.
libc = "0.2"

