[package]
name = "document-parity"
version = "0.1.0"
edition = "2024"
publish = false

# The reader half of the reference is the product's own reader sources, compiled in place (see
# `src/lib.rs`), so their unit tests are not built here.
[lib]
name = "document_parity"
path = "src/lib.rs"
test = false

[build-dependencies]
sha2 = "0.10"

[dependencies]
anyhow = "1.0"
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
office_oxide = { version = "=0.1.13" }
pdf-extract = { version = "0.12", default-features = false }
quick-xml = { version = "0.39", default-features = false }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1.50", default-features = false, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

